# AfterLifeRP core configuration.
# Player-facing texts live in messages_it.yml. Rule 12: no secrets in Git —
# this file is generated into plugins/AfterLifeRP/ at runtime and stays out of the repo.

database:
  host: 127.0.0.1
  port: 3306
  name: afterlife
  user: afterlife
  # Set the real password in the generated plugins/AfterLifeRP/config.yml, never in Git.
  password: ""
  pool-size: 8
  connect-timeout-ms: 5000

identity:
  nickname:
    min-length: 1
    max-length: 10

gui:
  session-timeout-seconds: 120

# Optional CraftEngine custom-model mapping: afterlife item type -> CraftEngine
# namespaced id. Any type left unmapped (or when CraftEngine is absent) keeps
# its vanilla-material look. Create the matching items in a CraftEngine pack.
custom-items:
  banknote: "afterlife:banknote"
  dirty_money: "afterlife:dirty_money"
  credit_card: "afterlife:credit_card"
  check: "afterlife:check"
  property_key: "afterlife:property_key"
  contract: "afterlife:contract"
  drug_dose: "afterlife:drug_dose"
  sealed_bag: "afterlife:sealed_bag"
  atm_hacking_device: "afterlife:atm_hacking_device"
  circuit_board: "afterlife:circuit_board"
  medical_certificate: "afterlife:medical_certificate"
  receipt: "afterlife:receipt"

poi:
  # Allowed POI types for /afterlife setup poi create. Extend as modules arrive.
  types:
    - GENERIC
    - ELECTRICAL_CABINET
    - TRAFFIC_LIGHT
    - REPEATER
    - ATM
    - BANK_TERMINAL
    - RESTAURANT
    - DELIVERY_DESTINATION
    - SHADOW_DROP
    - HOSPITAL_WORKSTATION
    - WORKSHOP_LIFT
    - IMPOUND_BAY
    - DEALERSHIP_GARAGE
    - NIGHTCLUB_SAFE
    - POS_TERMINAL
    - DJ_BOOTH
    - VIP_DOOR
