  property-key: "<yellow>Chiave — <property></yellow>"
  black-file: "<dark_red>File confidenziale — <property></dark_red>"
  receipt: "<white>Scontrino — <amount></white>"
  contract-signed: "<yellow>Contratto firmato</yellow>"
  contract-validated: "<gold>Contratto validato ⚖</gold>"
  circuit-board: "<gold>Scheda a circuito intatta</gold>"
  drink: "<aqua><name></aqua>"
  drink-masterwork: "<gold><name> ★</gold>"
  drink-diluted: "<gray><name> (annacquato)</gray>"
  unknown: "<white><type></white>"
  ems:
    forceps: "<aqua>Pinze chirurgiche</aqua>"
    bandage: "<white>Benda sterile</white>"
    splint: "<yellow>Stecca ortopedica</yellow>"
    medkit: "<red>Kit medico</red>"
    defibrillator: "<gold>Defibrillatore</gold>"
