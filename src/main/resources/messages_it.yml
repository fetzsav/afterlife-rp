# Messaggi in italiano (MiniMessage). Le chiavi restano in inglese.
prefix: "<dark_gray>[<gradient:#7b2ff7:#f107a3>AfterLife</gradient>]</dark_gray> "

general:
  no-permission: "<red>Non hai il permesso per farlo.</red>"
  player-only: "<red>Questo comando può essere usato solo da un giocatore.</red>"
  db-unavailable: "<red>Servizio momentaneamente non disponibile. Riprova tra poco.</red>"
  maintenance-kick: "<red>Server in manutenzione tecnica.\nRiprova tra qualche minuto.</red>"
  unknown-subcommand: "<red>Sottocomando sconosciuto. Usa <yellow><usage></yellow>.</red>"
  internal-error: "<red>Errore interno. Contatta lo staff.</red>"

identity:
  id-self: "<gray>Il tuo ID permanente è <yellow>#<id></yellow>.</gray>"
  welcome: "<gray>Bentornato, <white><name></white> <dark_gray>[#<id>]</dark_gray>.</gray>"

nickname:
  set: "<green>Nickname impostato: <white><nickname></white>.</green>"
  removed: "<yellow>Nickname rimosso.</yellow>"
  invalid-length: "<red>Il nickname deve avere da <min> a <max> caratteri visibili.</red>"
  invalid-content: "<red>Il nickname contiene caratteri non consentiti.</red>"
  usage: "<gray>Uso: <yellow>/setnick <testo|reset|off></yellow></gray>"

health:
  header: "<gray>Stato di <white>AfterLifeRP</white>:</gray>"
  db-ok: "<green>Database: connesso (<latency>ms)</green>"
  db-fail: "<red>Database: NON disponibile — <detail></red>"
  adapter-ok: "<green><name>: attivo</green> <dark_gray>(<detail>)</dark_gray>"
  adapter-missing: "<yellow><name>: non installato</yellow> <dark_gray>(<detail>)</dark_gray>"
  version: "<gray>Versione plugin: <white><version></white> — Paper <white><paper></white></gray>"

poi:
  created: "<green>POI <white><name></white> (<type>) creato alla tua posizione.</green>"
  removed: "<yellow>POI <white><name></white> rimosso.</yellow>"
  already-exists: "<red>Esiste già un POI con il nome <white><name></white>.</red>"
  not-found: "<red>Nessun POI trovato con il nome <white><name></white>.</red>"
  invalid-type: "<red>Tipo POI non valido. Tipi consentiti: <types></red>"
  region-not-found: "<red>La regione WorldGuard <white><region></white> non esiste in questo mondo.</red>"
  worldguard-missing: "<red>WorldGuard non è installato: impossibile associare una regione.</red>"
  list-header: "<gray>POI registrati (<count>):</gray>"
  list-entry: "<dark_gray> - </dark_gray><white><name></white> <gray>(<type>)</gray> <dark_gray><world> <x>,<y>,<z><region></dark_gray>"
  report-saved: "<green>Report setup salvato in <white><file></white>.</green>"
  usage: "<gray>Uso: <yellow>/afterlife setup poi <create|remove|list|report></yellow></gray>"

debug:
  item-issued: "<green>Oggetto serializzato emesso: <white><type></white> <dark_gray>serial <serial></dark_gray></green>"
  item-usage: "<gray>Uso: <yellow>/afterlife debug item <tipo> [taglio]</yellow></gray>"
  dirty-issued: "<dark_red>Denaro sporco emesso: <white><amount></white> (<count> banconote)</dark_red>"

bank:
  iban-info: "<gray>IBAN: <white><iban></white>\nSaldo: <green><balance></green>\nStato: <white><status></white></gray>"
  not-near-atm: "<red>Devi trovarti vicino a un bancomat o a uno sportello bancario.</red>"
  card-required: "<red>Ti serve una carta di credito valida. Chiedi a un banchiere.</red>"
  card-invalid: "<red>Questa carta non è valida o non è intestata a te.</red>"
  invalid-amount: "<red>Importo non valido. Usa multipli dei tagli disponibili.</red>"
  inventory-full: "<red>Inventario pieno: servono <slots> slot liberi.</red>"
  insufficient-funds: "<red>Fondi insufficienti.</red>"
  account-frozen: "<red>Il conto è congelato. Rivolgiti alla banca.</red>"
  target-not-found: "<red>Destinatario non trovato.</red>"
  duplicate-request: "<yellow>Richiesta già elaborata.</yellow>"
  withdraw-ok: "<green>Prelievo di <white><amount></white> completato.</green>"
  deposit-ok: "<green>Depositate <count> banconote per <white><amount></white>.</green>"
  no-notes: "<yellow>Nessuna banconota valida da depositare.</yellow>"
  transfer-ok: "<green>Bonifico di <white><amount></white> a <white><target></white> completato.</green>"
  bonifico-usage: "<gray>Uso: <yellow>/bonifico <IBAN|giocatore> <euro></yellow></gray>"
  statement-header: "<gray>Ultimi movimenti:</gray>"
  statement-entry: "<dark_gray> - </dark_gray><white><sign><amount></white> <gray>(<reason>)</gray> <dark_gray>saldo <balance> — <date></dark_gray>"
  assegno-usage: "<gray>Uso: <yellow>/assegno <giocatore> <euro></yellow></gray>"
  check-issued: "<green>Assegno di <white><amount></white> intestato a <white><payee></white> emesso.</green>"
  check-hold: "<red>Tieni l'assegno nella mano principale.</red>"
  check-redeemed: "<green>Assegno incassato: <white><amount></white>.</green>"
  check-not-payee: "<red>Questo assegno non è intestato a te.</red>"
  check-expired: "<red>Questo assegno è scaduto.</red>"
  check-invalid: "<red>Assegno non valido o già incassato.</red>"
  banchiere-usage: "<gray>Uso: <yellow>/banchiere <apri|carta|revoca> <giocatore></yellow></gray>"
  account-opened: "<green>Conto di <white><player></white>: <white><iban></white></green>"
  card-issued: "<green>Carta consegnata a <white><player></white>.</green>"
  cards-revoked: "<yellow>Revocate <count> carte di <white><player></white>.</yellow>"
  sequestro-usage: "<gray>Uso: <yellow>/sequestro <giocatore> <congela|scongela> <motivo></yellow></gray>"
  frozen-ok: "<red>Conto di <white><player></white> congelato. Motivo: <reason></red>"
  unfrozen-ok: "<green>Conto di <white><player></white> scongelato.</green>"
  freeze-unchanged: "<yellow>Nessuna modifica: il conto era già in quello stato.</yellow>"

reconcile:
  header: "<gray>Riconciliazione contabile:</gray>"
  ok: "<green>Nessun difetto — <transactions> transazioni e <accounts> conti verificati.</green>"
  defect: "<red> - <detail></red>"

org:
  created: "<green>Organizzazione <white><name></white> creata. IBAN tesoreria: <white><iban></white></green>"
  usage: "<gray>Uso: <yellow>/afterlife setup org create <tipo> <nome> [nome visibile]</yellow></gray>"
