name: AfterLifeRP
version: '${version}'
main: com.afterlife.rp.AfterLifeRPPlugin
api-version: '26.2'
authors: [AfterLife]
description: Modular city-roleplay core plugin (identity, ledger, items, missions, evidence)
softdepend: [LuckPerms, Vault, WorldGuard, PlaceholderAPI, Citizens]
libraries:
  - com.zaxxer:HikariCP:${hikariVersion}
  - org.flywaydb:flyway-core:${flywayVersion}
  - org.flywaydb:flyway-mysql:${flywayVersion}
  - org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}
commands:
  afterlife:
    description: AfterLifeRP administration and diagnostics
    usage: /afterlife <version|health|setup|debug>
  id:
    description: Show the permanent public ID
    usage: /id
    aliases: [identita]
  setnick:
    description: Set or remove the VIP nickname
    usage: /setnick <nickname|reset|off>
  iban:
    description: Show IBAN, balance, and account state
    usage: /iban
  atm:
    description: ATM menu and withdrawals
    usage: /atm [preleva <euro>]
    aliases: [banca, bancomat]
  bonifico:
    description: Transfer money by IBAN or player name
    usage: /bonifico <IBAN|player> <euro>
  assegno:
    description: Issue a payee-specific check
    usage: /assegno <player> <euro>
  incassa:
    description: Redeem the check held in the main hand
    usage: /incassa
  banchiere:
    description: Bank employee operations
    usage: /banchiere <apri|carta|revoca> <player>
  sequestro:
    description: Bank director account freeze/unfreeze
    usage: /sequestro <player> <congela|scongela> <reason>
  contratto:
    description: Propose and sign binding contracts
    usage: /contratto <proponi <player>|firma>
  valida_contratto:
    description: Lawyer contract validation
    usage: /valida_contratto
  fedina:
    description: Criminal record viewing and police management
    usage: /fedina [player] | aggiungi ... | sconta <id>
  pulisci_fedina:
    description: Lawyer criminal record rehabilitation
    usage: /pulisci_fedina <player>
  arresto:
    description: Start a detention with timer
    usage: /arresto <player> [minutes]
  rilascio:
    description: Release a detained player
    usage: /rilascio <player>
  avvocato:
    description: Request a lawyer while detained
    usage: /avvocato
  ricorso:
    description: Lawyer appeal against overdue detention
    usage: /ricorso <player>
  prova:
    description: Evidence creation and authorized viewing
    usage: /prova <crea <description>|vedi <id>>
  licenza:
    description: Show your active licenses
    usage: /licenza
  luoghidisponibili:
    description: List properties for sale
    usage: /luoghidisponibili
  luoghisporchi:
    description: List illegal rental properties (director)
    usage: /luoghisporchi
  agenzia:
    description: Real-estate agency operations
    usage: /agenzia <vendi|affittasporco|distruggi_file>
  cambia_serratura:
    description: Replace a property lock, revoking old keys
    usage: /cambia_serratura <property> <reason>
  cassaforte:
    description: Agency black safe (director)
    usage: /cassaforte [preleva <euro>]
  chiave:
    description: Check the key held in the main hand
    usage: /chiave
  elettricista:
    description: Electrician dispatch job
    usage: /elettricista <turno|fine|chiamate|accetta <poi>|ripara>
  rider:
    description: Food delivery job
    usage: /rider <turno|fine|ordine|ritira|consegna|accetta_pacco>
    aliases: [job]
  ems:
    description: EMS medic job
    usage: /ems <turno|scan|cura|produci|traccia|certificato|manuale|...>
    aliases: [medico]
permissions:
  afterlife.admin:
    description: Administrative diagnostics
    default: op
  afterlife.admin.setup:
    description: POI and infrastructure setup
    default: op
  afterlife.vip.nickname:
    description: Custom short nametag nickname
    default: false
  afterlife.bank.user:
    description: ATM, IBAN, transfers, checks
    default: true
  afterlife.bank.banker:
    description: Account and card management
    default: op
  afterlife.bank.director:
    description: Account freezes and bank administration
    default: op
  afterlife.legal.lawyer:
    description: Contracts, cases, records, appeals
    default: op
  afterlife.police.officer:
    description: Police tools and authorized searches
    default: op
  afterlife.realestate.agent:
    description: Legal property actions
    default: op
  afterlife.realestate.director:
    description: Dirty properties and black safe
    default: op
  afterlife.electrician.worker:
    description: Electrician missions
    default: op
  afterlife.delivery.driver:
    description: Delivery shifts
    default: op
  afterlife.ems.medic:
    description: Diagnosis, treatment, certificates
    default: op
