name: AfterLifeRP
version: '${version}'
main: com.afterlife.rp.AfterLifeRPPlugin
api-version: '26.2'
authors: [AfterLife]
description: Modular city-roleplay core plugin (identity, ledger, items, missions, evidence)
softdepend: [LuckPerms, Vault, WorldGuard, PlaceholderAPI, Citizens]
libraries:
  - com.zaxxer:HikariCP:${hikariVersion}
  - org.flywaydb:flyway-core:${flywayVersion}
  - org.flywaydb:flyway-mysql:${flywayVersion}
  - org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}
commands:
  afterlife:
    description: AfterLifeRP administration and diagnostics
    usage: /afterlife <version|health|setup|debug>
  id:
    description: Show the permanent public ID
    usage: /id
    aliases: [identita]
  setnick:
    description: Set or remove the VIP nickname
    usage: /setnick <nickname|reset|off>
  iban:
    description: Show IBAN, balance, and account state
    usage: /iban
  atm:
    description: ATM menu and withdrawals
    usage: /atm [preleva <euro>]
    aliases: [banca, bancomat]
  bonifico:
    description: Transfer money by IBAN or player name
    usage: /bonifico <IBAN|player> <euro>
  assegno:
    description: Issue a payee-specific check
    usage: /assegno <player> <euro>
  incassa:
    description: Redeem the check held in the main hand
    usage: /incassa
  banchiere:
    description: Bank employee operations
    usage: /banchiere <apri|carta|revoca> <player>
  sequestro:
    description: Bank director account freeze/unfreeze
    usage: /sequestro <player> <congela|scongela> <reason>
permissions:
  afterlife.admin:
    description: Administrative diagnostics
    default: op
  afterlife.admin.setup:
    description: POI and infrastructure setup
    default: op
  afterlife.vip.nickname:
    description: Custom short nametag nickname
    default: false
  afterlife.bank.user:
    description: ATM, IBAN, transfers, checks
    default: true
  afterlife.bank.banker:
    description: Account and card management
    default: op
  afterlife.bank.director:
    description: Account freezes and bank administration
    default: op
