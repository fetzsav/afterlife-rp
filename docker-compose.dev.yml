services:
  mariadb:
    image: mariadb:11.4
    container_name: afterlife-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-afterlife}
      MARIADB_USER: ${MARIADB_USER:-afterlife}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    ports:
      - "${MARIADB_BIND:-127.0.0.1}:${MARIADB_PORT:-3306}:3306"
    volumes:
      - afterlife-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  afterlife-mariadb-data:
