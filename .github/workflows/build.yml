# Dormant until the repo gets a GitHub remote; the local gate is `./gradlew check`.
name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew check
      - name: Integration tests (MariaDB via Testcontainers)
        run: AFTERLIFE_IT=1 ./gradlew test
