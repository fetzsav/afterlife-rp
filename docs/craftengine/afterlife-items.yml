# AfterLifeRP starter CraftEngine item pack.
#
# Drop this into plugins/CraftEngine/resources/afterlife/configuration/ and add
# your own model + texture assets, then /craftengine reload. Each id here
# matches config.yml `custom-items:`. These defaults reuse vanilla item models
# (no custom textures yet) so the pack loads immediately; replace `model:` with
# your resource-pack model paths when the art is ready.
#
# Identity still comes from AfterLifeRP's PDC + HMAC — CraftEngine only provides
# the visual base stack (see docs/item-catalog.md).

items:
  afterlife:banknote:
    material: paper
    data:
      item-name: "<green>Banconota</green>"
